---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: custom-kinoite
description: This is my personal OS image.
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 43

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - micro
        - fastfetch
        - mangohud
        - gamescope
        - zsh
        - google-droid-fonts-all

  - type: script
    scripts:
      - set-default-shell.sh
      - install-droid-sans-mono-nerd.sh

  - type: containerfile
    snippets:
      - RUN curl -sS https://starship.rs/install.sh | sh -s -- -y -b /usr/bin
      - RUN dnf5 -y install --setopt=install_weak_deps=False --best --allowerasing steam

  - type: signing
